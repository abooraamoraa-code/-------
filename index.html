<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>NOVA CUT — قص الفيديو</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #070b14;
      --panel: #0d1320;
      --panel2: #111a2b;
      --border: rgba(255,255,255,.09);
      --text: #f5f7fb;
      --muted: #8f9bb0;
      --accent: #6c63ff;
      --accent2: #8d85ff;
      --danger: #ff5577;
      --success: #20d49b;
    }

    body {
      min-height: 100vh;
      background:
        radial-gradient(circle at 20% 10%, rgba(108,99,255,.15), transparent 30%),
        radial-gradient(circle at 80% 20%, rgba(32,212,155,.08), transparent 25%),
        var(--bg);
      color: var(--text);
      font-family:
        Tahoma,
        Arial,
        sans-serif;
    }

    button,
    input {
      font-family: inherit;
    }

    .app {
      width: min(1200px, calc(100% - 30px));
      margin: auto;
      padding: 25px 0 50px;
    }

    /* HEADER */

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      padding: 15px 0 30px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo {
      width: 48px;
      height: 48px;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      background:
        linear-gradient(
          135deg,
          var(--accent),
          #a78bfa
        );
      font-size: 22px;
      font-weight: 900;
      box-shadow:
        0 10px 35px rgba(108,99,255,.3);
    }

    .brand-text h1 {
      font-size: 21px;
      letter-spacing: .5px;
    }

    .brand-text p {
      color: var(--muted);
      font-size: 12px;
      margin-top: 4px;
    }

    .status {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(255,255,255,.04);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 9px 14px;
      color: var(--muted);
      font-size: 12px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--success);
      box-shadow: 0 0 10px var(--success);
    }

    /* MAIN */

    .main {
      display: grid;
      gap: 18px;
    }

    .panel {
      background:
        linear-gradient(
          180deg,
          rgba(255,255,255,.035),
          rgba(255,255,255,.018)
        );
      border: 1px solid var(--border);
      border-radius: 22px;
      overflow: hidden;
      box-shadow: 0 20px 60px rgba(0,0,0,.2);
    }

    /* UPLOAD */

    .upload-panel {
      padding: 30px;
    }

    .upload-box {
      min-height: 260px;
      border: 2px dashed rgba(108,99,255,.4);
      border-radius: 20px;
      background:
        radial-gradient(
          circle at center,
          rgba(108,99,255,.08),
          transparent 65%
        );
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      cursor: pointer;
      transition: .25s ease;
    }

    .upload-box:hover {
      border-color: var(--accent);
      background:
        radial-gradient(
          circle at center,
          rgba(108,99,255,.14),
          transparent 65%
        );
      transform: translateY(-1px);
    }

    .upload-icon {
      width: 74px;
      height: 74px;
      margin: 0 auto 18px;
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(108,99,255,.13);
      border: 1px solid rgba(108,99,255,.25);
      font-size: 32px;
    }

    .upload-title {
      font-size: 21px;
      font-weight: 800;
      margin-bottom: 8px;
    }

    .upload-subtitle {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.8;
    }

    .upload-button {
      display: inline-flex;
      margin-top: 20px;
      padding: 12px 22px;
      border-radius: 12px;
      background: var(--accent);
      color: white;
      font-weight: 800;
      font-size: 13px;
    }

    #videoInput {
      display: none;
    }

    /* EDITOR */

    .editor {
      display: none;
    }

    .editor.active {
      display: block;
    }

    .video-area {
      padding: 20px;
    }

    .video-wrapper {
      width: 100%;
      background: #000;
      border-radius: 17px;
      overflow: hidden;
      position: relative;
    }

    #video {
      width: 100%;
      max-height: 570px;
      display: block;
      background: #000;
    }

    /* INFO */

    .info-row {
      display: grid;
      grid-template-columns:
        repeat(3, 1fr);
      gap: 12px;
      padding: 0 20px 20px;
    }

    .info-card {
      background: rgba(255,255,255,.035);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px;
      text-align: center;
    }

    .info-label {
      color: var(--muted);
      font-size: 11px;
      margin-bottom: 7px;
    }

    .info-value {
      font-size: 17px;
      font-weight: 900;
      direction: ltr;
    }

    /* TIMELINE */

    .timeline-panel {
      padding: 20px;
    }

    .timeline-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
    }

    .timeline-title {
      font-size: 15px;
      font-weight: 800;
    }

    .timeline-help {
      color: var(--muted);
      font-size: 11px;
    }

    .timeline {
      position: relative;
      height: 105px;
      border-radius: 15px;
      overflow: hidden;
      background: #05070c;
      border: 1px solid var(--border);
      user-select: none;
    }

    .thumbs {
      position: absolute;
      inset: 0;
      display: flex;
      overflow: hidden;
    }

    .thumb {
      flex: 1;
      min-width: 0;
      height: 100%;
      object-fit: cover;
      opacity: .65;
      border-right: 1px solid rgba(0,0,0,.35);
    }

    .timeline-dark-left,
    .timeline-dark-right {
      position: absolute;
      top: 0;
      bottom: 0;
      background: rgba(0,0,0,.68);
      pointer-events: none;
    }

    .timeline-dark-left {
      left: 0;
      width: 0%;
    }

    .timeline-dark-right {
      right: 0;
      width: 0%;
    }

    .selection {
      position: absolute;
      top: 0;
      bottom: 0;
      left: 0;
      width: 100%;
      border-top: 3px solid var(--accent);
      border-bottom: 3px solid var(--accent);
      pointer-events: none;
    }

    .handle {
      position: absolute;
      top: -2px;
      bottom: -2px;
      width: 18px;
      cursor: ew-resize;
      z-index: 10;
      transform: translateX(-50%);
    }

    .handle-line {
      position: absolute;
      left: 50%;
      top: 0;
      bottom: 0;
      width: 3px;
      background: white;
      transform: translateX(-50%);
      box-shadow:
        0 0 8px rgba(108,99,255,.9);
    }

    .handle-grip {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 18px;
      height: 42px;
      transform: translate(-50%, -50%);
      border-radius: 7px;
      background: var(--accent);
      border: 2px solid white;
      box-shadow:
        0 5px 20px rgba(0,0,0,.45);
    }

    .handle-grip::before,
    .handle-grip::after {
      content: "";
      position: absolute;
      top: 50%;
      width: 3px;
      height: 16px;
      background: rgba(255,255,255,.8);
      transform: translateY(-50%);
      border-radius: 4px;
    }

    .handle-grip::before {
      left: 5px;
    }

    .handle-grip::after {
      right: 5px;
    }

    .playhead {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 2px;
      background: #fff;
      z-index: 8;
      pointer-events: none;
      box-shadow: 0 0 7px rgba(255,255,255,.9);
    }

    .playhead-dot {
      position: absolute;
      top: 0;
      left: 50%;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: white;
      transform: translate(-50%, -50%);
    }

    /* CONTROLS */

    .controls {
      padding: 0 20px 20px;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .btn {
      border: 0;
      outline: 0;
      cursor: pointer;
      border-radius: 12px;
      padding: 12px 17px;
      color: white;
      font-size: 13px;
      font-weight: 800;
      transition: .2s ease;
    }

    .btn:hover {
      transform: translateY(-1px);
    }

    .btn:active {
      transform: translateY(1px);
    }

    .btn-primary {
      background: var(--accent);
      box-shadow: 0 8px 20px rgba(108,99,255,.2);
    }

    .btn-secondary {
      background: rgba(255,255,255,.07);
      border: 1px solid var(--border);
    }

    .btn-success {
      background: var(--success);
      color: #04120e;
    }

    .btn-danger {
      background: rgba(255,85,119,.12);
      border: 1px solid rgba(255,85,119,.25);
      color: #ff8da4;
    }

    .btn:disabled {
      opacity: .45;
      cursor: not-allowed;
      transform: none;
    }

    /* TIME CONTROLS */

    .time-controls {
      padding: 0 20px 20px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .time-box {
      background: rgba(255,255,255,.035);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 12px;
    }

    .time-box label {
      display: block;
      color: var(--muted);
      font-size: 11px;
      margin-bottom: 8px;
    }

    .time-box input {
      width: 100%;
      background: rgba(0,0,0,.25);
      border: 1px solid var(--border);
      border-radius: 9px;
      color: white;
      padding: 10px;
      direction: ltr;
      text-align: center;
      outline: none;
    }

    .time-box input:focus {
      border-color: var(--accent);
    }

    /* PROCESS */

    .process-panel {
      display: none;
      padding: 20px;
    }

    .process-panel.active {
      display: block;
    }

    .progress-container {
      height: 10px;
      border-radius: 999px;
      overflow: hidden;
      background: rgba(255,255,255,.07);
    }

    .progress-bar {
      height: 100%;
      width: 0%;
      background:
        linear-gradient(
          90deg,
          var(--accent),
          var(--success)
        );
      transition: width .2s ease;
    }

    .process-text {
      text-align: center;
      color: var(--muted);
      font-size: 12px;
      margin-top: 10px;
    }

    /* RESULT */

    .result-panel {
      display: none;
      padding: 20px;
    }

    .result-panel.active {
      display: block;
    }

    .result-box {
      background: rgba(32,212,155,.06);
      border: 1px solid rgba(32,212,155,.2);
      border-radius: 16px;
      padding: 20px;
      text-align: center;
    }

    .result-icon {
      font-size: 34px;
      margin-bottom: 10px;
    }

    .result-title {
      font-size: 18px;
      font-weight: 900;
      margin-bottom: 7px;
    }

    .result-text {
      color: var(--muted);
      font-size: 12px;
      margin-bottom: 16px;
    }

    /* MESSAGE */

    .message {
      display: none;
      margin: 0 20px 20px;
      padding: 12px 15px;
      border-radius: 12px;
      font-size: 12px;
      line-height: 1.7;
    }

    .message.show {
      display: block;
    }

    .message.error {
      background: rgba(255,85,119,.08);
      border: 1px solid rgba(255,85,119,.2);
      color: #ff9bae;
    }

    .message.success {
      background: rgba(32,212,155,.08);
      border: 1px solid rgba(32,212,155,.2);
      color: #7ce8c7;
    }

    /* FOOTER */

    .footer {
      text-align: center;
      padding: 25px 0 0;
      color: #667085;
      font-size: 11px;
    }

    /* MOBILE */

    @media (max-width: 700px) {

      .app {
        width: min(100% - 16px, 1200px);
        padding-top: 10px;
      }

      .header {
        padding-bottom: 18px;
      }

      .status {
        display: none;
      }

      .upload-panel {
        padding: 15px;
      }

      .upload-box {
        min-height: 220px;
      }

      .info-row {
        grid-template-columns: 1fr;
      }

      .time-controls {
        grid-template-columns: 1fr;
      }

      .timeline {
        height: 85px;
      }

      .controls {
        display: grid;
        grid-template-columns: 1fr 1fr;
      }

      .btn {
        width: 100%;
      }
    }
  </style>
</head>

<body>

  <div class="app">

    <!-- HEADER -->

    <header class="header">

      <div class="brand">

        <div class="logo">
          ✂
        </div>

        <div class="brand-text">
          <h1>NOVA CUT</h1>
          <p>أداة سريعة لتجهيز وقص الفيديو</p>
        </div>

      </div>

      <div class="status">
        <span class="status-dot"></span>
        جاهز للعمل
      </div>

    </header>


    <main class="main">

      <!-- UPLOAD -->

      <section class="panel upload-panel" id="uploadPanel">

        <label
          class="upload-box"
          for="videoInput"
          id="uploadBox"
        >

          <div>

            <div class="upload-icon">
              🎬
            </div>

            <div class="upload-title">
              ارفع الفيديو للبدء
            </div>

            <div class="upload-subtitle">
              اختر ملف فيديو من جهازك
              <br>
              المعالجة ستتم داخل المتصفح
            </div>

            <div class="upload-button">
              اختيار الفيديو
            </div>

          </div>

        </label>

        <input
          id="videoInput"
          type="file"
          accept="video/*"
        >

      </section>


      <!-- EDITOR -->

      <section
        class="panel editor"
        id="editor"
      >

        <!-- VIDEO -->

        <div class="video-area">

          <div class="video-wrapper">

            <video
              id="video"
              controls
              playsinline
              preload="metadata"
            ></video>

          </div>

        </div>


        <!-- INFORMATION -->

        <div class="info-row">

          <div class="info-card">

            <div class="info-label">
              بداية القص
            </div>

            <div
              class="info-value"
              id="startDisplay"
            >
              00:00.000
            </div>

          </div>


          <div class="info-card">

            <div class="info-label">
              نهاية القص
            </div>

            <div
              class="info-value"
              id="endDisplay"
            >
              00:00.000
            </div>

          </div>


          <div class="info-card">

            <div class="info-label">
              مدة المقطع
            </div>

            <div
              class="info-value"
              id="durationDisplay"
            >
              00:00.000
            </div>

          </div>

        </div>


        <!-- TIMELINE -->

        <div class="timeline-panel">

          <div class="timeline-header">

            <div class="timeline-title">
              خط الفيديو
            </div>

            <div class="timeline-help">
              اسحب الخطين لتحديد الجزء المطلوب
            </div>

          </div>


          <div
            class="timeline"
            id="timeline"
          >

            <div
              class="thumbs"
              id="thumbs"
            ></div>


            <div
              class="timeline-dark-left"
              id="darkLeft"
            ></div>


            <div
              class="timeline-dark-right"
              id="darkRight"
            ></div>


            <div
              class="selection"
              id="selection"
            ></div>


            <!-- PLAYHEAD -->

            <div
              class="playhead"
              id="playhead"
              style="left:0%"
            >
              <div class="playhead-dot"></div>
            </div>


            <!-- START HANDLE -->

            <div
              class="handle"
              id="startHandle"
              style="left:0%"
            >

              <div class="handle-line"></div>
              <div class="handle-grip"></div>

            </div>


            <!-- END HANDLE -->

            <div
              class="handle"
              id="endHandle"
              style="left:100%"
            >

              <div class="handle-line"></div>
              <div class="handle-grip"></div>

            </div>

          </div>

        </div>


        <!-- EXACT TIME -->

        <div class="time-controls">

          <div class="time-box">

            <label>
              وقت البداية بالثواني
            </label>

            <input
              id="startInput"
              type="number"
              min="0"
              step="0.001"
              value="0"
            >

          </div>


          <div class="time-box">

            <label>
              وقت النهاية بالثواني
            </label>

            <input
              id="endInput"
              type="number"
              min="0"
              step="0.001"
              value="0"
            >

          </div>

        </div>


        <!-- BUTTONS -->

        <div class="controls">

          <button
            class="btn btn-secondary"
            id="setStartBtn"
          >
            تحديد البداية من مكان التشغيل
          </button>


          <button
            class="btn btn-secondary"
            id="setEndBtn"
          >
            تحديد النهاية من مكان التشغيل
          </button>


          <button
            class="btn btn-primary"
            id="previewBtn"
          >
            ▶ معاينة الجزء المحدد
          </button>


          <button
            class="btn btn-danger"
            id="resetBtn"
          >
            إعادة التحديد
          </button>


          <button
            class="btn btn-success"
            id="cutBtn"
          >
            ✂ قص الفيديو
          </button>

        </div>


        <!-- MESSAGE -->

        <div
          class="message"
          id="message"
        ></div>


        <!-- PROCESS -->

        <div
          class="process-panel"
          id="processPanel"
        >

          <div class="progress-container">

            <div
              class="progress-bar"
              id="progressBar"
            ></div>

          </div>

          <div
            class="process-text"
            id="processText"
          >
            جاري تجهيز المعالجة...
          </div>

        </div>


        <!-- RESULT -->

        <div
          class="result-panel"
          id="resultPanel"
        >

          <div class="result-box">

            <div class="result-icon">
              ✅
            </div>

            <div class="result-title">
              تم تجهيز الفيديو
            </div>

            <div class="result-text">
              المقطع المحدد أصبح جاهزًا للتنزيل.
            </div>

            <button
              class="btn btn-success"
              id="downloadBtn"
            >
              ⬇ تنزيل الفيديو
            </button>

          </div>

        </div>

      </section>

    </main>


    <footer class="footer">
      NOVA CUT — Video Editing Tool
    </footer>

  </div>


  <!--
    مهم:
    هذا الملف مسؤول عن الواجهة فقط.

    المعالجة الحقيقية سنضعها في:
    processor.js

    ومحرك الفيديو سنضعه في:
    engine/ffmpeg-loader.js

    لا نضع FFmpeg هنا حتى نفصل الواجهة
    عن المعالجة ونحل مشكلة الخطأ.
  -->

  <script type="module">

    /*
      ============================================================
      NOVA CUT — واجهة المستخدم
      ============================================================
    */

    const videoInput =
      document.getElementById("videoInput");

    const uploadPanel =
      document.getElementById("uploadPanel");

    const uploadBox =
      document.getElementById("uploadBox");

    const editor =
      document.getElementById("editor");

    const video =
      document.getElementById("video");

    const timeline =
      document.getElementById("timeline");

    const thumbs =
      document.getElementById("thumbs");

    const startHandle =
      document.getElementById("startHandle");

    const endHandle =
      document.getElementById("endHandle");

    const selection =
      document.getElementById("selection");

    const darkLeft =
      document.getElementById("darkLeft");

    const darkRight =
      document.getElementById("darkRight");

    const playhead =
      document.getElementById("playhead");

    const startInput =
      document.getElementById("startInput");

    const endInput =
      document.getElementById("endInput");

    const startDisplay =
      document.getElementById("startDisplay");

    const endDisplay =
      document.getElementById("endDisplay");

    const durationDisplay =
      document.getElementById("durationDisplay");

    const setStartBtn =
      document.getElementById("setStartBtn");

    const setEndBtn =
      document.getElementById("setEndBtn");

    const previewBtn =
      document.getElementById("previewBtn");

    const resetBtn =
      document.getElementById("resetBtn");

    const cutBtn =
      document.getElementById("cutBtn");

    const message =
      document.getElementById("message");

    const processPanel =
      document.getElementById("processPanel");

    const progressBar =
      document.getElementById("progressBar");

    const processText =
      document.getElementById("processText");

    const resultPanel =
      document.getElementById("resultPanel");

    const downloadBtn =
      document.getElementById("downloadBtn");


    /*
      ============================================================
      الحالة
      ============================================================
    */

    let videoFile = null;

    let videoURL = null;

    let outputURL = null;

    let videoDuration = 0;

    let startTime = 0;

    let endTime = 0;

    let dragging = null;

    let previewTimer = null;


    /*
      ============================================================
      أدوات الوقت
      ============================================================
    */

    function formatTime(seconds) {

      if (!Number.isFinite(seconds)) {
        seconds = 0;
      }

      seconds =
        Math.max(0, seconds);

      const minutes =
        Math.floor(seconds / 60);

      const remaining =
        seconds % 60;

      const mins =
        String(minutes)
          .padStart(2, "0");

      const secs =
        remaining
          .toFixed(3)
          .padStart(6, "0");

      return `${mins}:${secs}`;
    }


    /*
      ============================================================
      الرسائل
      ============================================================
    */

    function showMessage(text, type = "error") {

      message.textContent = text;

      message.className =
        "message show " + type;

    }


    function hideMessage() {

      message.className =
        "message";

      message.textContent = "";

    }


    /*
      ============================================================
      تحديث المعلومات
      ============================================================
    */

    function updateDisplays() {

      const selectedDuration =
        Math.max(
          0,
          endTime - startTime
        );

      startDisplay.textContent =
        formatTime(startTime);

      endDisplay.textContent =
        formatTime(endTime);

      durationDisplay.textContent =
        formatTime(selectedDuration);

      startInput.value =
        startTime.toFixed(3);

      endInput.value =
        endTime.toFixed(3);

      updateTimelineVisuals();

    }


    /*
      ============================================================
      تحديث شكل الخط الزمني
      ============================================================
    */

    function updateTimelineVisuals() {

      if (!videoDuration) {
        return;
      }

      const startPercent =
        (startTime / videoDuration) * 100;

      const endPercent =
        (endTime / videoDuration) * 100;

      selection.style.left =
        startPercent + "%";

      selection.style.width =
        (endPercent - startPercent) + "%";

      darkLeft.style.width =
        startPercent + "%";

      darkRight.style.width =
        (100 - endPercent) + "%";

      startHandle.style.left =
        startPercent + "%";

      endHandle.style.left =
        endPercent + "%";

    }


    /*
      ============================================================
      تحديث مؤشر التشغيل
      ============================================================
    */

    function updatePlayhead() {

      if (!videoDuration) {
        return;
      }

      const percent =
        (video.currentTime / videoDuration) * 100;

      playhead.style.left =
        Math.max(
          0,
          Math.min(100, percent)
        ) + "%";

    }


    /*
      ============================================================
      اختيار الفيديو
      ============================================================
    */

    videoInput.addEventListener(
      "change",
      async function(event) {

        const file =
          event.target.files &&
          event.target.files[0];

        if (!file) {
          return;
        }

        await loadVideo(file);

      }
    );


    /*
      ============================================================
      سحب وإفلات
      ============================================================
    */

    uploadBox.addEventListener(
      "dragover",
      function(event) {

        event.preventDefault();

        uploadBox.style.borderColor =
          "var(--accent)";

      }
    );


    uploadBox.addEventListener(
      "dragleave",
      function() {

        uploadBox.style.borderColor =
          "rgba(108,99,255,.4)";

      }
    );


    uploadBox.addEventListener(
      "drop",
      async function(event) {

        event.preventDefault();

        uploadBox.style.borderColor =
          "rgba(108,99,255,.4)";

        const files =
          event.dataTransfer.files;

        if (!files || !files.length) {
          return;
        }

        const file =
          files[0];

        if (!file.type.startsWith("video/")) {

          showMessage(
            "الملف الذي اخترته ليس فيديو."
          );

          return;
        }

        await loadVideo(file);

      }
    );


    /*
      ============================================================
      تحميل الفيديو
      ============================================================
    */

    async function loadVideo(file) {

      hideMessage();

      videoFile = file;

      if (videoURL) {

        URL.revokeObjectURL(
          videoURL
        );

      }

      videoURL =
        URL.createObjectURL(file);

      video.src =
        videoURL;

      video.load();

      uploadPanel.style.display =
        "none";

      editor.classList.add(
        "active"
      );

      resultPanel.classList.remove(
        "active"
      );

      processPanel.classList.remove(
        "active"
      );

      await waitForMetadata();

      videoDuration =
        video.duration;

      startTime = 0;

      endTime =
        videoDuration;

      updateDisplays();

      await generateThumbnails();

    }


    /*
      ============================================================
      انتظار بيانات الفيديو
      ============================================================
    */

    function waitForMetadata() {

      return new Promise(
        function(resolve, reject) {

          if (
            Number.isFinite(video.duration) &&
            video.duration > 0
          ) {

            resolve();

            return;

          }

          const onLoaded =
            function() {

              cleanup();

              resolve();

            };

          const onError =
            function() {

              cleanup();

              reject(
                new Error(
                  "تعذر قراءة الفيديو."
                )
              );

            };

          function cleanup() {

            video.removeEventListener(
              "loadedmetadata",
              onLoaded
            );

            video.removeEventListener(
              "error",
              onError
            );

          }

          video.addEventListener(
            "loadedmetadata",
            onLoaded
          );

          video.addEventListener(
            "error",
            onError
          );

        }
      );

    }


    /*
      ============================================================
      إنشاء صور الخط الزمني
      ============================================================
    */

    async function generateThumbnails() {

      thumbs.innerHTML = "";

      const count = 30;

      const canvas =
        document.createElement(
          "canvas"
        );

      const context =
        canvas.getContext(
          "2d"
        );

      canvas.width = 320;

      canvas.height = 180;

      for (
        let i = 0;
        i < count;
        i++
      ) {

        const percentage =
          i / (count - 1);

        const time =
          videoDuration *
          percentage;

        try {

          await seekVideo(
            time
          );

          context.drawImage(
            video,
            0,
            0,
            canvas.width,
            canvas.height
          );

          const image =
            document.createElement(
              "img"
            );

          image.className =
            "thumb";

          image.src =
            canvas.toDataURL(
              "image/jpeg",
              0.55
            );

          thumbs.appendChild(
            image
          );

        } catch (error) {

          /*
            في حالة عدم نجاح إحدى الصور
            لا نوقف البرنامج كاملًا.
          */

          const image =
            document.createElement(
              "div"
            );

          image.className =
            "thumb";

          image.style.background =
            "#111827";

          thumbs.appendChild(
            image
          );

        }

      }

      video.currentTime = 0;

      updatePlayhead();

    }


    /*
      ============================================================
      الانتقال إلى وقت معين
      ============================================================
    */

    function seekVideo(time) {

      return new Promise(
        function(resolve) {

          const target =
            Math.max(
              0,
              Math.min(
                videoDuration,
                time
              )
            );

          const handler =
            function() {

              video.removeEventListener(
                "seeked",
                handler
              );

              resolve();

            };

          video.addEventListener(
            "seeked",
            handler
          );

          video.currentTime =
            target;

        }
      );

    }


    /*
      ============================================================
      تشغيل الفيديو
      ============================================================
    */

    video.addEventListener(
      "timeupdate",
      function() {

        updatePlayhead();

      }
    );


    /*
      ============================================================
      تحديد البداية من مكان التشغيل
      ============================================================
    */

    setStartBtn.addEventListener(
      "click",
      function() {

        const current =
          video.currentTime;

        if (
          current >= endTime
        ) {

          showMessage(
            "يجب أن تكون البداية قبل النهاية."
          );

          return;
        }

        startTime =
          current;

        updateDisplays();

      }
    );


    /*
      ============================================================
      تحديد النهاية من مكان التشغيل
      ============================================================
    */

    setEndBtn.addEventListener(
      "click",
      function() {

        const current =
          video.currentTime;

        if (
          current <= startTime
        ) {

          showMessage(
            "يجب أن تكون النهاية بعد البداية."
          );

          return;
        }

        endTime =
          current;

        updateDisplays();

      }
    );


    /*
      ============================================================
      إدخال وقت البداية يدويًا
      ============================================================
    */

    startInput.addEventListener(
      "change",
      function() {

        let value =
          Number(
            startInput.value
          );

        if (!Number.isFinite(value)) {
          value = 0;
        }

        value =
          Math.max(
            0,
            Math.min(
              value,
              endTime - 0.001
            )
          );

        startTime =
          value;

        updateDisplays();

      }
    );


    /*
      ============================================================
      إدخال وقت النهاية يدويًا
      ============================================================
    */

    endInput.addEventListener(
      "change",
      function() {

        let value =
          Number(
            endInput.value
          );

        if (!Number.isFinite(value)) {
          value = videoDuration;
        }

        value =
          Math.min(
            videoDuration,
            Math.max(
              value,
              startTime + 0.001
            )
          );

        endTime =
          value;

        updateDisplays();

      }
    );


    /*
      ============================================================
      التعامل مع سحب الخطوط
      ============================================================
    */

    startHandle.addEventListener(
      "pointerdown",
      function(event) {

        event.preventDefault();

        dragging =
          "start";

        startHandle.setPointerCapture(
          event.pointerId
        );

      }
    );


    endHandle.addEventListener(
      "pointerdown",
      function(event) {

        event.preventDefault();

        dragging =
          "end";

        endHandle.setPointerCapture(
          event.pointerId
        );

      }
    );


    document.addEventListener(
      "pointermove",
      function(event) {

        if (!dragging) {
          return;
        }

        const rect =
          timeline.getBoundingClientRect();

        let x =
          event.clientX -
          rect.left;

        x =
          Math.max(
            0,
            Math.min(
              rect.width,
              x
            )
          );

        const percent =
          x / rect.width;

        const time =
          percent *
          videoDuration;

        if (
          dragging === "start"
        ) {

          startTime =
            Math.min(
              time,
              endTime - 0.001
            );

        }

        if (
          dragging === "end"
        ) {

          endTime =
            Math.max(
              time,
              startTime + 0.001
            );

        }

        updateDisplays();

      }
    );


    document.addEventListener(
      "pointerup",
      function() {

        dragging = null;

      }
    );

      الضغط على الخط الزمني
      ============================================================
    */

        if (
